<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>项目详情 | 潘泽文 — 个人作品集</title>
<meta name="description" content="项目详情与编辑页" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=Noto+Sans+SC:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0A0A0F; --bg2:#0D0D14; --card:#141420;
    --border:rgba(255,255,255,.07); --border-dim:rgba(255,255,255,.05);
    --text:#E8E8F0; --text2:#9A9AAF; --muted:#6A6A7A;
    --accent:#00E5FF;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:'Noto Sans SC',sans-serif;min-height:100vh}
  .mono{font-family:'JetBrains Mono',monospace}
  a{text-decoration:none;color:inherit}

  /* ===== nav ===== */
  nav{position:fixed;top:0;left:0;right:0;z-index:50;background:rgba(10,10,15,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--border-dim)}
  .nav-inner{max-width:1200px;margin:0 auto;padding:0 16px;height:64px;display:flex;align-items:center;justify-content:space-between}
  .logo{display:flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:500;letter-spacing:.05em}
  .logo .zap{color:var(--accent)}
  .logo .acc{color:var(--accent)}
  .logo .y{color:var(--muted);font-size:11px}
  .nav-actions{display:flex;align-items:center;gap:10px}
  .btn{display:inline-flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.08em;padding:8px 14px;border-radius:6px;border:1px solid var(--border);color:var(--text2);background:transparent;cursor:pointer;transition:all .25s}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.primary{border-color:var(--accent);color:var(--accent);background:rgba(0,229,255,.06)}
  .btn.primary:hover{background:rgba(0,229,255,.14);box-shadow:0 0 20px rgba(0,229,255,.15)}
  .btn.danger:hover{border-color:#FF2A6D;color:#FF2A6D}
  .btn:disabled{opacity:.4;cursor:not-allowed}

  /* ===== layout ===== */
  main{max-width:1200px;margin:0 auto;padding:110px 16px 80px}
  .crumb{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.25em;color:var(--muted);text-transform:uppercase;display:flex;align-items:center;gap:8px;margin-bottom:28px}
  .crumb a:hover{color:var(--accent)}
  .crumb .sep{color:var(--muted)}

  .card{background:var(--card);border:1px solid var(--border-dim);border-radius:8px;overflow:hidden}
  .accent-bar{height:3px;width:100%}
  .card-body{padding:28px 24px 36px}
  @media(min-width:768px){.card-body{padding:44px 48px 52px}}

  .head-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .idx-line{display:flex;align-items:center;gap:10px;font-family:'JetBrains Mono',monospace;font-size:12px}
  .idx-line .pid{color:var(--muted);opacity:.6}
  .idx-line .sep2{color:var(--muted);opacity:.4}
  .idx-line .ptag{font-weight:500}
  h1{font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:600;line-height:1.25;margin-top:18px}
  @media(min-width:768px){h1{font-size:36px}}
  .tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
  .tag{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.08em;padding:4px 10px;border:1px solid var(--border);color:var(--muted);border-radius:4px}

  .meta{display:grid;grid-template-columns:1fr;gap:1px;background:var(--border-dim);border:1px solid var(--border-dim);border-radius:8px;overflow:hidden;margin-top:32px}
  @media(min-width:768px){.meta{grid-template-columns:1fr 1fr 1fr}}
  .meta>div{background:var(--bg2);padding:16px 18px}
  .meta .k{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase}
  .meta .v{font-size:14px;color:var(--text2);margin-top:6px}

  h2{font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.25em;color:var(--accent);text-transform:uppercase;margin-top:40px;display:flex;align-items:center;gap:10px}
  h2::after{content:"";flex:1;height:1px;background:var(--border-dim)}
  .desc{font-size:15px;line-height:1.9;color:var(--text2);margin-top:16px;max-width:820px}
  .highlights{margin-top:16px;list-style:none}
  .highlights li{position:relative;padding:10px 0 10px 26px;font-size:14px;line-height:1.8;color:var(--text2);border-bottom:1px dashed var(--border-dim)}
  .highlights li:last-child{border-bottom:none}
  .highlights li::before{content:">";position:absolute;left:2px;font-family:'JetBrains Mono',monospace;color:var(--accent)}

  .foot-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:44px;padding-top:28px;border-top:1px solid var(--border-dim)}

  /* ===== edit form ===== */
  .field{margin-top:22px}
  .field label{display:block;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;margin-bottom:8px}
  .field input,.field textarea{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:'Noto Sans SC',sans-serif;font-size:14px;padding:11px 14px;outline:none;transition:border-color .2s,box-shadow .2s}
  .field input.mono-in{font-family:'JetBrains Mono',monospace}
  .field textarea{resize:vertical;min-height:110px;line-height:1.8}
  .field input:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,229,255,.08)}
  .hint{font-size:11px;color:var(--muted);margin-top:6px;font-family:'JetBrains Mono',monospace}

  .toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--card);border:1px solid var(--accent);color:var(--text);font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.1em;padding:12px 22px;border-radius:6px;opacity:0;pointer-events:none;transition:all .35s;z-index:99;box-shadow:0 0 30px rgba(0,229,255,.12)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .notfound{max-width:560px;margin:140px auto;text-align:center;color:var(--text2)}
  .notfound .code{font-family:'JetBrains Mono',monospace;font-size:64px;color:var(--accent)}
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a class="logo" href="index.html">
      <svg class="zap" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/></svg>
      <span class="acc">PZW</span><span class="y">// 2026</span>
    </a>
    <div class="nav-actions">
      <a class="btn" href="index.html#projects">← 返回项目列表</a>
      <button class="btn primary" id="modeBtn" type="button">✎ 编辑</button>
    </div>
  </div>
</nav>

<main id="app"></main>

<div class="toast" id="toast"></div>

<script>
/* ================= 默认项目数据（与主页一致，含扩展字段） ================= */
const ACCENT_HEX = {"m-accent-1":"#00E5FF","m-accent-2":"#FF2A6D","m-accent-3":"#7B2CBF"};
const STORE_KEY = "pzw_projects_v1";

const DEFAULTS = [
  {
    id:"01", title:"倾转旋翼混合翼无人机载荷控制", accent:"m-accent-1",
    tags:["LOAD_CONTROL","MATLAB","SIMULINK","ANSYS"],
    role:"控制算法设计与仿真验证", period:"硕士研究课题",
    description:"建立静止与吹风状态下振动工况的机翼根部负载模型，设计基于不变流形(IM)和OICC算法的约束非线性控制分配框架，实现机翼载荷控制优化。",
    highlights:[
      "建立静止/吹风双工况的机翼根部负载动力学模型",
      "设计基于不变流形(IM)的约束非线性控制分配框架",
      "实现OICC算法并完成Simulink闭环仿真验证",
      "完成Ansys结构强度校核，验证载荷控制效果"
    ]
  },
  {
    id:"02", title:"塑料盖板注塑模具设计（本科毕设）", accent:"m-accent-2",
    tags:["SOLIDWORKS","UG","ANSYS","CFD"],
    role:"模具结构设计负责人", period:"本科毕业设计",
    description:"运用SolidWorks对塑件进行三维建模，通过UG为塑件开模，针对外观要求优化注塑工艺参数，完成Ansys结构强度校核与CFD模流分析。",
    highlights:[
      "完成塑件三维建模与拔模/分型面设计",
      "使用UG完成整套注塑模具结构设计",
      "针对外观缺陷优化注塑工艺参数",
      "完成Ansys强度校核与CFD模流分析"
    ]
  },
  {
    id:"03", title:"亿航智能 — 航电结构工程师", accent:"m-accent-3",
    tags:["CATIA","SURFACE","UAV","LIGHTWEIGHT"],
    role:"航电结构设计实习生", period:"企业实习",
    description:"参与某型无人机航电结构设计，负责吊装摄像头外形设计，使用Catia完成曲面设计，完成电路板、摄像头与机体轻量化连接机构的仿真验证。",
    highlights:[
      "负责吊装摄像头外形与曲面设计",
      "完成电路板、摄像头与机体轻量化连接机构设计",
      "使用Catia完成复杂曲面建模",
      "完成连接机构仿真验证并输出工程图"
    ]
  },
  {
    id:"04", title:"西安奇维科技 — 结构工程师", accent:"m-accent-1",
    tags:["CREO","ANSYS","FLUENT","THERMAL"],
    role:"电气结构设计师", period:"企业实习",
    description:"参与转塔伺服控制系统电气结构设计，使用Creo完成发控盒盒体三维设计，使用Ansys和Fluent完成结构强度与热仿真设计。",
    highlights:[
      "使用Creo完成发控盒盒体三维结构设计",
      "完成结构强度Ansys仿真校核",
      "完成Fluent热仿真与散热方案评估",
      "参与转塔伺服控制系统电气结构设计评审"
    ]
  }
];

/* ================= 数据读写 ================= */
function loadAll(){
  let stored = null;
  try{ stored = JSON.parse(localStorage.getItem(STORE_KEY) || "null"); }catch(e){ stored = null; }
  if(!Array.isArray(stored)) return JSON.parse(JSON.stringify(DEFAULTS));
  // 与默认值按 id 合并，保证扩展字段完整
  return DEFAULTS.map(d => {
    const s = stored.find(x => x.id === d.id) || {};
    return Object.assign({}, d, s);
  });
}
function saveAll(list){
  localStorage.setItem(STORE_KEY, JSON.stringify(list));
}

/* ================= 路由与状态 ================= */
const params = new URLSearchParams(location.search);
const projectId = params.get("id");
let projects = loadAll();
let project = projects.find(p => p.id === projectId) || null;
let editing = params.get("edit") === "1";

const app = document.getElementById("app");
const modeBtn = document.getElementById("modeBtn");
const toastEl = document.getElementById("toast");

function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastEl._t);
  toastEl._t = setTimeout(()=>toastEl.classList.remove("show"), 2200);
}
function esc(s){ return String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function accent(){ return ACCENT_HEX[project.accent] || ACCENT_HEX["m-accent-1"]; }

/* ================= 渲染 ================= */
function render(){
  document.documentElement.style.setProperty("--accent", accent());
  if(!project){
    app.innerHTML = `<div class="notfound">
      <div class="code">404</div>
      <p style="margin:16px 0 24px">未找到 id 为 <b>${esc(projectId)}</b> 的项目</p>
      <a class="btn primary" href="index.html#projects">返回项目列表</a>
    </div>`;
    modeBtn.style.display = "none";
    return;
  }
  document.title = project.title + " | 潘泽文 — 个人作品集";
  modeBtn.textContent = editing ? "✓ 完成" : "✎ 编辑";

  const hex = accent();
  const tags = (project.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join("");
  const highlights = (project.highlights||[]).map(h=>`<li>${esc(h)}</li>`).join("");

  if(!editing){
    app.innerHTML = `
    <div class="crumb"><a href="index.html">主页</a><span class="sep">/</span><a href="index.html#projects">项目</a><span class="sep">/</span><span style="color:var(--accent)">${esc(project.id)}</span></div>
    <div class="card">
      <div class="accent-bar" style="background:${hex}"></div>
      <div class="card-body">
        <div class="head-row">
          <div class="idx-line">
            <span class="pid">${esc(project.id)}</span><span class="sep2">//</span>
            <span class="ptag" style="color:${hex}">${esc((project.tags||[])[0]||"")}</span>
          </div>
          <span class="mono" style="font-size:11px;color:var(--muted);letter-spacing:.15em">PROJECT.DETAIL</span>
        </div>
        <h1>${esc(project.title)}</h1>
        <div class="tags">${tags}</div>
        <div class="meta">
          <div><div class="k">角色 / ROLE</div><div class="v">${esc(project.role||"—")}</div></div>
          <div><div class="k">周期 / PERIOD</div><div class="v">${esc(project.period||"—")}</div></div>
          <div><div class="k">编号 / ID</div><div class="v mono">${esc(project.id)} / 04</div></div>
        </div>
        <h2>项目概述</h2>
        <p class="desc">${esc(project.description)}</p>
        <h2>核心工作</h2>
        <ul class="highlights">${highlights || '<li style="color:var(--muted)">暂无内容，点击右上角「编辑」添加</li>'}</ul>
        <div class="foot-actions">
          <button class="btn primary" id="editBtn" type="button">✎ 编辑此项目</button>
          <a class="btn" href="index.html#projects">← 返回项目列表</a>
          <button class="btn" id="exportBtn" type="button">⤓ 导出 JSON</button>
        </div>
      </div>
    </div>`;
    document.getElementById("editBtn").onclick = ()=>{ editing = true; render(); window.scrollTo({top:0,behavior:"smooth"}); };
    document.getElementById("exportBtn").onclick = exportJSON;
  } else {
    app.innerHTML = `
    <div class="crumb"><a href="index.html">主页</a><span class="sep">/</span><a href="index.html#projects">项目</a><span class="sep">/</span><span style="color:var(--accent)">${esc(project.id)}</span><span class="sep">/</span><span>编辑</span></div>
    <div class="card">
      <div class="accent-bar" style="background:${hex}"></div>
      <div class="card-body">
        <div class="head-row">
          <div class="idx-line">
            <span class="pid">${esc(project.id)}</span><span class="sep2">//</span>
            <span class="ptag" style="color:${hex}">EDIT.MODE</span>
          </div>
        </div>
        <div class="field"><label>项目标题</label>
          <input id="f-title" value="${esc(project.title)}" /></div>
        <div class="field"><label>角色 / ROLE</label>
          <input id="f-role" class="mono-in" value="${esc(project.role||"")}" /></div>
        <div class="field"><label>周期 / PERIOD</label>
          <input id="f-period" class="mono-in" value="${esc(project.period||"")}" /></div>
        <div class="field"><label>标签（用英文逗号分隔）</label>
          <input id="f-tags" class="mono-in" value="${esc((project.tags||[]).join(", "))}" />
          <div class="hint">例：MATLAB, SIMULINK, ANSYS</div></div>
        <div class="field"><label>项目描述</label>
          <textarea id="f-desc">${esc(project.description)}</textarea></div>
        <div class="field"><label>核心工作（每行一条）</label>
          <textarea id="f-high" style="min-height:150px">${esc((project.highlights||[]).join("\n"))}</textarea></div>
        <div class="foot-actions">
          <button class="btn primary" id="saveBtn" type="button">✓ 保存修改</button>
          <button class="btn" id="cancelBtn" type="button">取消</button>
          <button class="btn danger" id="resetBtn" type="button">↺ 重置为默认</button>
        </div>
      </div>
    </div>`;
    document.getElementById("saveBtn").onclick = save;
    document.getElementById("cancelBtn").onclick = ()=>{ editing = false; render(); };
    document.getElementById("resetBtn").onclick = resetOne;
  }
}

function save(){
  const title = document.getElementById("f-title").value.trim();
  if(!title){ toast("标题不能为空"); return; }
  project.title = title;
  project.role = document.getElementById("f-role").value.trim();
  project.period = document.getElementById("f-period").value.trim();
  project.tags = document.getElementById("f-tags").value.split(/[,，]/).map(s=>s.trim()).filter(Boolean);
  project.description = document.getElementById("f-desc").value.trim();
  project.highlights = document.getElementById("f-high").value.split("\n").map(s=>s.trim()).filter(Boolean);
  const idx = projects.findIndex(p=>p.id===project.id);
  if(idx>=0) projects[idx] = project; else projects.push(project);
  saveAll(projects);
  editing = false;
  render();
  toast("✓ 已保存，主页项目卡片已同步更新");
}

function resetOne(){
  if(!confirm(`确定将「${project.title}」重置为默认内容？此操作不可撤销。`)) return;
  const d = DEFAULTS.find(x=>x.id===project.id);
  project = JSON.parse(JSON.stringify(d));
  const idx = projects.findIndex(p=>p.id===project.id);
  if(idx>=0) projects[idx] = project;
  saveAll(projects);
  editing = false;
  render();
  toast("↺ 已恢复默认内容");
}

function exportJSON(){
  const blob = new Blob([JSON.stringify(project, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `project-${project.id}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast("⤓ 已导出 JSON 文件");
}

modeBtn.onclick = ()=>{ if(!project) return; editing = !editing; render(); if(!editing) window.scrollTo({top:0,behavior:"smooth"}); };

render();
</script>
</body>
</html>
