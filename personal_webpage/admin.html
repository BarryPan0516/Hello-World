<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>编辑中心 | 潘泽文 — 个人作品集</title>
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=Noto+Sans+SC:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0A0A0F; --bg2:#0D0D14; --card:#141420;
    --border:rgba(255,255,255,.07); --border-dim:rgba(255,255,255,.05);
    --text:#E8E8F0; --text2:#9A9AAF; --muted:#6A6A7A;
    --a1:#00E5FF; --a2:#FF2A6D; --a3:#7B2CBF;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:'Noto Sans SC',sans-serif;min-height:100vh}
  .mono{font-family:'JetBrains Mono',monospace}
  a{text-decoration:none;color:inherit}

  nav{position:fixed;top:0;left:0;right:0;z-index:50;background:rgba(10,10,15,.78);backdrop-filter:blur(16px) saturate(1.6);-webkit-backdrop-filter:blur(16px) saturate(1.6);border-bottom:1px solid var(--border-dim)}
  .nav-inner{max-width:1000px;margin:0 auto;padding:0 16px;height:64px;display:flex;align-items:center;justify-content:space-between}
  .logo{display:flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:500}
  .logo .acc{color:var(--a1)}
  .logo .y{color:var(--muted);font-size:11px}
  .btn{display:inline-flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.08em;padding:8px 14px;border-radius:6px;border:1px solid var(--border);color:var(--text2);background:transparent;cursor:pointer;transition:all .25s}
  .btn:hover{border-color:var(--a1);color:var(--a1)}
  .btn.primary{border-color:var(--a1);color:var(--a1);background:rgba(0,229,255,.06)}
  .btn.primary:hover{background:rgba(0,229,255,.14);box-shadow:0 0 20px rgba(0,229,255,.15)}
  .btn.danger:hover{border-color:#FF2A6D;color:#FF2A6D}

  main{max-width:1000px;margin:0 auto;padding:104px 16px 70px}

  .crumb{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.25em;color:var(--muted);text-transform:uppercase;display:flex;align-items:center;gap:8px;margin-bottom:22px}
  .crumb a:hover{color:var(--a1)}
  .head{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:28px}
  .head .sys{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.3em;color:var(--a1);text-transform:uppercase;display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .head .sys::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--a1);animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  h1{font-family:'JetBrains Mono',monospace;font-size:28px;font-weight:600}
  @media(min-width:768px){h1{font-size:36px}}
  .head .sub{color:var(--muted);font-size:13px;margin-top:6px}

  /* 可编辑条目区块 —— 结构预留：后续可扩展姓名/电话/背景等 */
  .sec{margin-top:26px}
  .sec-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .sec-head .bar{width:3px;height:16px;border-radius:2px}
  .sec-head .t{font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.2em;text-transform:uppercase}
  .sec-head .c{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted)}

  .card{background:var(--card);border:1px solid var(--border-dim);border-radius:8px;overflow:hidden}
  .row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border-dim);transition:background .2s}
  .row:last-child{border-bottom:none}
  .row:hover{background:rgba(255,255,255,.02)}
  .row .id{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);min-width:22px}
  .row .dot{width:8px;height:8px;border-radius:2px;min-width:8px}
  .row .title{flex:1;font-size:14px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .tags{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);display:none;gap:6px}
  @media(min-width:640px){.row .tags{display:flex}}
  .row .acts{display:flex;gap:8px;min-width:118px;justify-content:flex-end}
  .mini{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.05em;padding:5px 11px;border-radius:5px;border:1px solid var(--border);color:var(--text2);background:transparent;cursor:pointer;transition:all .2s;white-space:nowrap}
  .mini:hover{border-color:var(--a1);color:var(--a1)}
  .mini.edit{border-color:rgba(0,229,255,.35);color:var(--a1);background:rgba(0,229,255,.05)}

  .global{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px;padding-top:22px;border-top:1px solid var(--border-dim)}
  .pgrid{display:grid;grid-template-columns:1fr;gap:14px 16px}
  @media(min-width:640px){.pgrid{grid-template-columns:1fr 1fr}}
  .pf label{display:block;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;margin-bottom:6px}
  .pf input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:'Noto Sans SC',sans-serif;font-size:14px;padding:10px 13px;outline:none;transition:border-color .2s,box-shadow .2s}
  .pf input.mono-in{font-family:'JetBrains Mono',monospace}
  .pf input:focus{border-color:#FF2A6D;box-shadow:0 0 0 3px rgba(255,42,109,.08)}
  .pf-hint{font-size:11px;color:var(--muted);align-self:center;font-family:'JetBrains Mono',monospace}
  .note{margin-top:18px;font-size:12px;color:var(--muted);line-height:1.8;border-left:2px solid rgba(0,229,255,.3);padding-left:12px}

  .toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--card);border:1px solid var(--a1);color:var(--text);font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.1em;padding:12px 22px;border-radius:6px;opacity:0;pointer-events:none;transition:all .35s;z-index:99;box-shadow:0 0 30px rgba(0,229,255,.12)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a class="logo" href="index.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#00E5FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/></svg>
      <span class="acc">PZW</span><span class="y">// ADMIN</span>
    </a>
    <a class="btn" href="index.html">← 返回主页</a>
  </div>
</nav>

<main>
  <div class="crumb"><a href="index.html">主页</a><span>/</span><span style="color:var(--a1)">ADMIN</span></div>
  <div class="head">
    <div>
      <div class="sys">ADMIN.PANEL // 编辑中心</div>
      <h1>内容编辑</h1>
      <div class="sub">修改会实时同步到主页，数据保存在浏览器本地</div>
    </div>
  </div>

  <!-- 可编辑条目区块：后续新增条目（姓名/电话/背景等）在此扩展 SECTIONS 数组即可 -->
  <div id="sections"></div>

  <div class="global">
    <button class="btn" id="exportAll" type="button">⤓ 导出全部数据 (JSON)</button>
    <button class="btn danger" id="resetAll" type="button">↺ 恢复全部默认</button>
  </div>
  <div class="note">提示：编辑内容保存在当前浏览器的 localStorage 中，换浏览器或清除缓存后会恢复默认数据；建议用「导出全部数据」定期备份。</div>
</main>

<div class="toast" id="toast"></div>

<script>
/* ================= 与主页 / 详情页共享的数据 ================= */
const ACCENT_HEX = {"m-accent-1":"#00E5FF","m-accent-2":"#FF2A6D","m-accent-3":"#7B2CBF"};
const STORE_KEY = "pzw_projects_v1";
const PROFILE_KEY = "pzw_profile_v1";

const PROFILE_DEFAULTS = { nameZh:"潘泽文", nameEn:"Barry", phone:"(+86) 16602953837", email:"barrypan0516@163.com", school:"香港科技大学", major:"航空工程硕士" };
const PROFILE_FIELDS = [
  {key:"nameZh", label:"姓名（中文）", mono:false},
  {key:"nameEn", label:"姓名（英文）", mono:true},
  {key:"phone",  label:"电话", mono:true},
  {key:"email",  label:"邮箱", mono:true},
  {key:"school", label:"学校", mono:false},
  {key:"major",  label:"专业", mono:false}
];
function loadProfile(){
  let s=null;
  try{ s=JSON.parse(localStorage.getItem(PROFILE_KEY)||"null"); }catch(e){ s=null; }
  return Object.assign({}, PROFILE_DEFAULTS, s||{});
}
function saveProfile(p){ localStorage.setItem(PROFILE_KEY, JSON.stringify(p)); }

const DEFAULTS = [
  {id:"01",title:"倾转旋翼混合翼无人机载荷控制",accent:"m-accent-1",tags:["LOAD_CONTROL","MATLAB","SIMULINK","ANSYS"],role:"控制算法设计与仿真验证",period:"硕士研究课题",description:"建立静止与吹风状态下振动工况的机翼根部负载模型，设计基于不变流形(IM)和OICC算法的约束非线性控制分配框架，实现机翼载荷控制优化。",highlights:["建立静止/吹风双工况的机翼根部负载动力学模型","设计基于不变流形(IM)的约束非线性控制分配框架","实现OICC算法并完成Simulink闭环仿真验证","完成Ansys结构强度校核，验证载荷控制效果"]},
  {id:"02",title:"塑料盖板注塑模具设计（本科毕设）",accent:"m-accent-2",tags:["SOLIDWORKS","UG","ANSYS","CFD"],role:"模具结构设计负责人",period:"本科毕业设计",description:"运用SolidWorks对塑件进行三维建模，通过UG为塑件开模，针对外观要求优化注塑工艺参数，完成Ansys结构强度校核与CFD模流分析。",highlights:["完成塑件三维建模与拔模/分型面设计","使用UG完成整套注塑模具结构设计","针对外观缺陷优化注塑工艺参数","完成Ansys强度校核与CFD模流分析"]},
  {id:"03",title:"亿航智能 — 航电结构工程师",accent:"m-accent-3",tags:["CATIA","SURFACE","UAV","LIGHTWEIGHT"],role:"航电结构设计实习生",period:"企业实习",description:"参与某型无人机航电结构设计，负责吊装摄像头外形设计，使用Catia完成曲面设计，完成电路板、摄像头与机体轻量化连接机构的仿真验证。",highlights:["负责吊装摄像头外形与曲面设计","完成电路板、摄像头与机体轻量化连接机构设计","使用Catia完成复杂曲面建模","完成连接机构仿真验证并输出工程图"]},
  {id:"04",title:"西安奇维科技 — 结构工程师",accent:"m-accent-1",tags:["CREO","ANSYS","FLUENT","THERMAL"],role:"电气结构设计师",period:"企业实习",description:"参与转塔伺服控制系统电气结构设计，使用Creo完成发控盒盒体三维设计，使用Ansys和Fluent完成结构强度与热仿真设计。",highlights:["使用Creo完成发控盒盒体三维结构设计","完成结构强度Ansys仿真校核","完成Fluent热仿真与散热方案评估","参与转塔伺服控制系统电气结构设计评审"]}
];

function loadAll(){
  let stored=null;
  try{ stored=JSON.parse(localStorage.getItem(STORE_KEY)||"null"); }catch(e){ stored=null; }
  if(!Array.isArray(stored)) return JSON.parse(JSON.stringify(DEFAULTS));
  return DEFAULTS.map(d=>Object.assign({},d,stored.find(x=>x.id===d.id)||{}));
}
function saveAll(list){ localStorage.setItem(STORE_KEY,JSON.stringify(list)); }
function loadRaw(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY)||"null"); }catch(e){ return null; } }

/* ================= 可编辑条目区块注册表 =================
   后续新增可编辑条目（姓名、电话、背景等）时，在这里加一个区块定义即可：
   { key, code, title, accent, render(container), count() }                              */
const SECTIONS = [
  {
    key:"projects", code:"PROJECTS", title:"项目经历", accent:"#00E5FF",
    count:()=>loadAll().length,
    render(el){
      const list = loadAll();
      el.innerHTML = list.map(p=>`
        <div class="row">
          <span class="id">${p.id}</span>
          <span class="dot" style="background:${ACCENT_HEX[p.accent]||"#00E5FF"}"></span>
          <span class="title">${esc(p.title)}</span>
          <span class="tags">${(p.tags||[]).slice(0,3).map(t=>`<span>#${esc(t)}</span>`).join("")}</span>
          <span class="acts">
            <a class="mini" href="project.html?id=${encodeURIComponent(p.id)}">查看</a>
            <a class="mini edit" href="project.html?id=${encodeURIComponent(p.id)}&edit=1">✎ 编辑</a>
          </span>
        </div>`).join("");
    }
  },
  {
    key:"profile", code:"PROFILE", title:"个人信息", accent:"#FF2A6D",
    count:()=>PROFILE_FIELDS.length,
    render(el){
      const p = loadProfile();
      el.innerHTML = `
        <div style="padding:20px 18px 24px">
          <div class="pgrid">
            ${PROFILE_FIELDS.map(f=>`
              <div class="pf">
                <label>${f.label}</label>
                <input id="pf-${f.key}" class="${f.mono?'mono-in':''}" value="${esc(p[f.key])}" />
              </div>`).join("")}
          </div>
          <div style="display:flex;gap:10px;margin-top:18px;flex-wrap:wrap">
            <button class="mini edit" id="pf-save" type="button" style="padding:8px 18px">✓ 保存个人信息</button>
            <button class="mini" id="pf-reset" type="button" style="padding:8px 18px">↺ 恢复默认</button>
            <span class="pf-hint">保存后主页姓名（中/英）、电话、邮箱、学校、专业同步更新</span>
          </div>
        </div>`;
      document.getElementById("pf-save").onclick = ()=>{
        const np = {};
        PROFILE_FIELDS.forEach(f=>{ np[f.key] = document.getElementById("pf-"+f.key).value.trim(); });
        if(!np.nameZh || !np.email){ toast("姓名（中文）和邮箱不能为空"); return; }
        saveProfile(np);
        toast("✓ 个人信息已保存，主页已同步");
      };
      document.getElementById("pf-reset").onclick = ()=>{
        if(!confirm("确定恢复个人信息为默认内容？")) return;
        localStorage.removeItem(PROFILE_KEY);
        this.render(el);
        toast("↺ 已恢复默认");
      };
    }
  }
  /* { key:"profile", code:"PROFILE", title:"个人信息", accent:"#FF2A6D", ... }, */
  /* { key:"contact-info", code:"CONTACT", title:"联系方式", accent:"#7B2CBF", ... }, */
];

/* ================= 渲染 ================= */
const toastEl=document.getElementById("toast");
function toast(msg){ toastEl.textContent=msg; toastEl.classList.add("show"); clearTimeout(toastEl._t); toastEl._t=setTimeout(()=>toastEl.classList.remove("show"),2200); }
function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function render(){
  const box=document.getElementById("sections");
  box.innerHTML = SECTIONS.map(s=>`
    <div class="sec">
      <div class="sec-head">
        <span class="bar" style="background:${s.accent}"></span>
        <span class="t" style="color:${s.accent}">${s.code}</span>
        <span style="color:var(--text2);font-size:14px">${s.title}</span>
        <span class="c">${s.count()} 项</span>
      </div>
      <div class="card" id="sec-${s.key}"></div>
    </div>`).join("");
  SECTIONS.forEach(s=>s.render(document.getElementById("sec-"+s.key)));
}

document.getElementById("exportAll").onclick=()=>{
  const raw=loadRaw();
  const payload={ exportedAt:new Date().toISOString(), storeKey:STORE_KEY, projects:raw||loadAll() };
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download="pzw-portfolio-data.json"; a.click();
  URL.revokeObjectURL(a.href);
  toast("⤓ 已导出全部数据");
};
document.getElementById("resetAll").onclick=()=>{
  if(!confirm("确定恢复全部项目为默认内容？所有本地修改将丢失。")) return;
  localStorage.removeItem(STORE_KEY);
  render();
  toast("↺ 已恢复全部默认");
};

render();
</script>
</body>
</html>
